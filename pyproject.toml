[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endnote-local"
version = "0.1.0"
description = "Search, cite and read an EndNote library straight from EndNote's own database (CLI + MCP server)."
requires-python = ">=3.11"
dependencies = ["numpy", "pymupdf", "sentence-transformers", "mcp"]

[project.scripts]
enlib = "endnote_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
